######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  # This is a example source plugin **only for test and demonstrate the feature source plugin**
  MySQL-CDC {
      base-url = "jdbc:mysql://localhost:3306/beego"
      username = "root"
      password = "12345678"
      table-names = ["beego.announcement", "beego.gift_card"]

      startup.mode = "initial"
    }
}

transform {
}

sink {
  jdbc {
;           url = "jdbc:mysql://localhost:3306?characterEncoding=utf8mb4&connectionCollation=utf8mb4_9000_as_cs"
          url = "jdbc:mysql://localhost:3306?connectionCollation=utf8mb4_9000_as_cs"
          driver = "com.mysql.cj.jdbc.Driver"
          user = "root"
          password = "12345678"

          database = "beego2"
          table = "${table_name}"
          schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
          create_table_sql = """
                CREATE TABLE IF NOT EXISTS ${table} (
                  ${columns}
                ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_9000_as_cs
              """
          generate_sink_sql = true
          data_save_mode="APPEND_DATA"
      }
}